name: Build SANRO Drawer Lab TESTING APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-android-testing-apk.yml
      - 'android-testing/**'

permissions:
  contents: read

concurrency:
  group: android-testing-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-testing-apk:
    name: Verify and build isolated Drawer Lab debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout Tunas Baru repository
        uses: actions/checkout@v4

      - name: Guard repository and select Android source
        id: source
        shell: bash
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          if [[ "$repo" != "arioguswara-oss/sanro-tunasbaru-android-build" ]]; then
            echo "Refusing build outside arioguswara-oss/Sanro-TunasBaru-Android-Build (got $GITHUB_REPOSITORY)." >&2
            exit 1
          fi

          if [[ ! -f android-testing/gradlew ]]; then
            echo "Android TESTING Gradle project was not found at android-testing/." >&2
            exit 1
          fi
          project_dir="android-testing"
          test_file="android-testing/qa/cash-drawer-source.test.cjs"
          if [[ ! -f "$test_file" ]]; then
            echo "Cash Drawer source guard is missing: $test_file" >&2
            exit 1
          fi

          if [[ ! -f "$project_dir/app/src/main/java/com/sanrotech/pos/MainActivity.java" ]]; then
            echo "MainActivity.java is missing from the selected Android project." >&2
            exit 1
          fi
          if ! grep -Fq "CASH_DRAWER_KICK_ENABLED = BuildConfig.CASH_DRAWER_KICK_ENABLED;" \
            "$project_dir/app/src/main/java/com/sanrotech/pos/MainActivity.java"; then
            echo "Variant-gated Cash Drawer flag missing." >&2
            exit 1
          fi
          if ! grep -Fq "buildConfigField 'boolean', 'CASH_DRAWER_KICK_ENABLED', 'false'" \
            "$project_dir/app/build.gradle"; then
            echo "Default-disabled gate is missing." >&2
            exit 1
          fi
          if ! grep -Fq "buildConfigField 'boolean', 'CASH_DRAWER_KICK_ENABLED', 'true'" \
            "$project_dir/app/build.gradle"; then
            echo "Drawer Lab-only opt-in gate is missing." >&2
            exit 1
          fi

          {
            echo "project_dir=$project_dir"
            echo "test_file=$test_file"
          } >> "$GITHUB_OUTPUT"
          echo "PROJECT_DIR=$project_dir" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK API 35 and build tools
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Node.js for the Cash Drawer source guard
        if: steps.source.outputs.test_file != ''
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Cash Drawer source guard
        if: steps.source.outputs.test_file != ''
        run: node "${{ steps.source.outputs.test_file }}"

      - name: Build and run Android unit tests
        working-directory: ${{ steps.source.outputs.project_dir }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace testDrawerLabUnitTest assembleDrawerLab

      - name: Verify APK identity and signing certificate
        id: inspect
        shell: bash
        run: |
          set -euo pipefail
          apk="$PROJECT_DIR/app/build/outputs/apk/drawerLab/app-drawerLab.apk"
          if [[ ! -f "$apk" ]]; then
            echo "Expected debug APK not found: $apk" >&2
            exit 1
          fi

          application_id="$(apkanalyzer manifest application-id "$apk")"
          version_code="$(apkanalyzer manifest version-code "$apk")"
          version_name="$(apkanalyzer manifest version-name "$apk")"
          if [[ "$application_id" != "com.sanrotech.pos.testing.drawerlab" ]]; then
            echo "Refusing non-TESTING package: $application_id" >&2
            exit 1
          fi
          aapt_bin="${ANDROID_HOME}/build-tools/35.0.0/aapt"
          if [[ ! -x "$aapt_bin" ]]; then
            echo "Build-tools aapt not found; cannot verify Drawer Lab label." >&2
            exit 1
          fi
          label_line="$("$aapt_bin" dump badging "$apk" | grep '^application-label:' | head -n1)"
          if [[ "$label_line" != "application-label:'SANRO Drawer Lab'" ]]; then
            echo "Invalid Drawer Lab label: $label_line" >&2
            exit 1
          fi

          if [[ "$version_code" != "7" || "$version_name" != "1.0.7-testing-drawerlab" ]]; then
            echo "Unexpected TESTING version: code=$version_code name=$version_name" >&2
            exit 1
          fi

          report_dir="$RUNNER_TEMP/drawer-lab-apk-inspection"
          mkdir -p "$report_dir"
          {
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Workflow commit: $GITHUB_SHA"
            echo "Package: $application_id"
            echo "Version code: $version_code"
            echo "Version name: $version_name"
            echo "Launcher label: SANRO Drawer Lab"
            echo "Signing: Android Gradle debug signing (not a release key)"
            echo "Variant: Drawer Lab; original SANRO POS TESTING remains intact."
            echo "Coexistence: separate app package, preferences, and Bluetooth pairing; existing SANRO POS TESTING is not replaced."
            echo "APK SHA-256: $(sha256sum "$apk" | cut -d ' ' -f 1)"
            echo
            echo "apksigner verification and signer certificate details:"
            apksigner_bin="${ANDROID_HOME}/build-tools/35.0.0/apksigner"
            if [[ ! -x "$apksigner_bin" ]]; then
              echo "Android build-tools 35.0.0 apksigner executable is missing." >&2
              exit 1
            fi
            "$apksigner_bin" verify --verbose --print-certs "$apk"
          } | tee "$report_dir/DRAWER-LAB-APK-INSPECTION.txt"
          echo "report_dir=$report_dir" >> "$GITHUB_OUTPUT"

      - name: Upload inspectable Drawer Lab TESTING APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: sanro-drawer-lab-testing-debug-${{ github.run_number }}
          path: |
            ${{ steps.source.outputs.project_dir }}/app/build/outputs/apk/drawerLab/app-drawerLab.apk
            ${{ steps.inspect.outputs.report_dir }}/DRAWER-LAB-APK-INSPECTION.txt
          if-no-files-found: error
          retention-days: 14
