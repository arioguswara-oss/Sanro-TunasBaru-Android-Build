plugins { id 'com.android.application' }

android {
    namespace 'com.sanrotech.pos'
    compileSdk 35

    defaultConfig {
        applicationId 'com.sanrotech.pos.testing'
        minSdk 24
        targetSdk 35
        versionCode 7
        versionName '1.0.7-testing'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
