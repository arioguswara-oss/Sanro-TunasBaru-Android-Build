plugins { id 'com.android.application' }

android {
    namespace 'com.sanrotech.pos'
    compileSdk 35

    defaultConfig {
        applicationId 'com.sanrotech.pos.testing'
        minSdk 24
        targetSdk 35
        versionCode 7
        versionName '1.0.7-testing'
        // Default-disabled for normal TESTING/debug and release builds.
        buildConfigField 'boolean', 'CASH_DRAWER_KICK_ENABLED', 'false'
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        // Drawer Lab gets a separate package; the existing debug variant is unchanged.
        drawerLab {
            initWith debug
            applicationIdSuffix '.drawerlab'
            versionNameSuffix '-drawerlab'
            // Owner-approved manual pulse solely in isolated Drawer Lab variant.
            buildConfigField 'boolean', 'CASH_DRAWER_KICK_ENABLED', 'true'
            matchingFallbacks = ['debug']
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
